apiVersion: 1

groups:
  - orgId: 1
    name: homelab07-platform
    folder: HomeLab07
    interval: 1m
    rules:
      - uid: hl07-endpoint-down
        title: Approved endpoint unavailable
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: &prometheus_query
              datasource: {type: prometheus, uid: homelab07-prometheus}
              editorMode: code
              expr: probe_success
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model: &less_than_one
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: An approved service endpoint is unavailable.
          runbook: docs/observability/ALERTS.md#approved-endpoint-unavailable
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-batch-failed
        title: Platform batch operation failed
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: '(homelab07_backup_last_status == bool 0) or absent(homelab07_backup_last_status) or (homelab07_security_last_status == bool 0) or absent(homelab07_security_last_status) or (homelab07_platform_last_status == bool 0) or absent(homelab07_platform_last_status) or (homelab07_rockstor_last_status == bool 0) or absent(homelab07_rockstor_last_status)'
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: A platform batch operation reported failure or disappeared.
          runbook: docs/observability/ALERTS.md#batch-operation-failed-or-stale
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-fast-batch-stale
        title: Fast collector metrics are stale
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 1800, to: 0}
            model:
              <<: *prometheus_query
              expr: 'time() - {__name__=~"homelab07_(platform|rockstor)_last_run_timestamp_seconds"}'
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [900], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Platform or Rockstor metrics have not completed recently.
          runbook: docs/observability/ALERTS.md#batch-operation-failed-or-stale
        labels: {platform: homelab07, severity: warning}

      - uid: hl07-backup-stale
        title: Backup recovery point is stale
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 172800, to: 0}
            model:
              <<: *prometheus_query
              expr: time() - homelab07_backup_last_success_timestamp_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [172800], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: No successful recovery point exists inside the baseline interval.
          runbook: docs/observability/ALERTS.md#backup-stale
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-security-stale
        title: Security evidence is stale
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 604800, to: 0}
            model:
              <<: *prometheus_query
              expr: time() - homelab07_security_last_success_timestamp_seconds
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [604800], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 15m
        annotations:
          summary: No successful vulnerability scan exists inside the baseline interval.
          runbook: docs/observability/ALERTS.md#security-scan-stale
        labels: {platform: homelab07, severity: warning}

      - uid: hl07-storage-mount
        title: Expected storage mount is invalid
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: 'homelab07_storage_mount_ok * homelab07_storage_fstype_ok'
          - refId: B
            datasourceUid: __expr__
            model: *less_than_one
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: An expected Rockstor path is missing or mounted with the wrong filesystem.
          runbook: docs/observability/ALERTS.md#expected-storage-mount-invalid
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-storage-critical
        title: Storage pressure is critical
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: 'max by (storage) (homelab07_storage_space_used_percent or homelab07_storage_inodes_used_percent or homelab07_storage_btrfs_data_used_percent or homelab07_storage_btrfs_metadata_used_percent)'
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [90], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Storage or inode use is above the critical baseline.
          runbook: docs/observability/ALERTS.md#storage-pressure
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-btrfs-errors
        title: Btrfs reports a critical state
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: 'increase(homelab07_storage_device_errors_total[15m]) or homelab07_storage_read_only'
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: Btrfs is read-only or reports device errors.
          runbook: docs/observability/ALERTS.md#btrfs-critical-state
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-gitleaks
        title: Gitleaks reports possible secrets
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: homelab07_security_gitleaks_findings
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        annotations:
          summary: The latest complete Git history scan contains possible-secret findings.
          runbook: docs/observability/ALERTS.md#gitleaks-findings
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-host-pressure
        title: Host resource pressure is sustained
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 900, to: 0}
            model:
              <<: *prometheus_query
              instant: false
              range: true
              expr: '100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) or (100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)'
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [90], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        annotations:
          summary: Host CPU or memory pressure has remained above the critical baseline.
          runbook: docs/observability/ALERTS.md#host-resource-pressure
        labels: {platform: homelab07, severity: critical}

      - uid: hl07-cert-expiry
        title: TLS certificate approaches expiry
        condition: B
        data:
          - refId: A
            datasourceUid: homelab07-prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              <<: *prometheus_query
              expr: probe_ssl_earliest_cert_expiry - time()
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1209600], type: lt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {params: [], type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: Alerting
        for: 15m
        annotations:
          summary: An approved HTTPS endpoint certificate expires within fourteen days.
          runbook: docs/observability/ALERTS.md#certificate-expiry
        labels: {platform: homelab07, severity: warning}
