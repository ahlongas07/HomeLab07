server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Static page without scripts or external resources. Locations must not
    # declare add_header, or these headers stop being inherited.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
    }
}
